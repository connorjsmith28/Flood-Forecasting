version: 2

sources:
  - name: raw
    description: Raw data extracted from hydrology APIs via Dagster
    schema: raw
    tables:
      - name: site_metadata
        description: Detailed USGS site metadata including drainage area
        columns:
          - name: site_id
            description: USGS site identifier
          - name: station_name
            description: Station name
          - name: latitude
            description: Decimal latitude
          - name: longitude
            description: Decimal longitude
          - name: drainage_area_sq_mi
            description: Drainage area in square miles
          - name: huc_code
            description: Hydrologic Unit Code

      - name: streamflow_15min
        description: USGS instantaneous streamflow observations (15-minute intervals)
        columns:
          - name: site_id
            description: USGS site identifier
          - name: datetime
            description: Observation timestamp
          - name: streamflow_cfs
            description: Discharge in cubic feet per second
          - name: gage_height_ft
            description: Water level (gage height) in feet above datum
          - name: qualifiers
            description: Data quality flags
          - name: extracted_at
            description: When the data was extracted

      - name: streamflow_daily
        description: USGS daily mean streamflow observations
        columns:
          - name: site_id
            description: USGS site identifier
          - name: date
            description: Observation date
          - name: streamflow_cfs_mean
            description: Daily mean discharge in cubic feet per second
          - name: gage_height_ft_mean
            description: Daily mean water level (gage height) in feet above datum
          - name: qualifiers
            description: Data quality flags
          - name: extracted_at
            description: When the data was extracted

      - name: nldas3_forcing
        identifier: weather_forcing
        description: NLDAS-3 watershed-averaged hourly forcing data (CAMELS-H methodology)
        columns:
          - name: site_id
            description: USGS site identifier (matches GAGES-II)
          - name: datetime
            description: Observation timestamp (UTC)
          - name: air_temp_c
            description: Air temperature at 2m (°C)
          - name: specific_humidity_kgkg
            description: Specific humidity at 2m (kg/kg)
          - name: surface_pressure_pa
            description: Surface pressure (Pa)
          - name: wind_u_ms
            description: Eastward wind component at 10m (m/s)
          - name: wind_v_ms
            description: Northward wind component at 10m (m/s)
          - name: shortwave_radiation_wm2
            description: Surface downward shortwave radiation (W/m²)
          - name: longwave_radiation_wm2
            description: Surface downward longwave radiation (W/m²)
          - name: precipitation_mm
            description: Hourly precipitation (mm)
          - name: convective_precip_fraction
            description: Fraction of precipitation that is convective (-)
          - name: cape_jkg
            description: Convective available potential energy (J/kg)
          - name: potential_evaporation_mm
            description: Potential evaporation (mm/hr)
          - name: extracted_at
            description: When the data was extracted

      - name: nldas3_watershed_mapping
        description: Area-weighted grid cell mapping for NLDAS-3 watershed averaging
        columns:
          - name: site_id
            description: USGS site identifier
          - name: grid_row
            description: NLDAS-3 grid row index (0 = southernmost)
          - name: grid_col
            description: NLDAS-3 grid column index (0 = westernmost)
          - name: area_weight
            description: Fraction of watershed area covered by this grid cell (sums to 1.0 per site)
          - name: computed_at
            description: When the mapping was computed
